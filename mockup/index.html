<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#19203a">
<title>JCIA 2027 — Maquette app</title>
<style>
  :root{
    --navy:#19203a; --navy-2:#232c4d; --green:#2fb36d; --yellow:#f5c542; --red:#e5484d;
    --bg:#f5f3ee; --card:#ffffff; --text:#171a29; --muted:#667085; --line:#e6e2d8;
    --radius:16px; --tab-h:64px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#10142a; --card:#1a2040; --text:#f2f1ec; --muted:#a0a6c0; --line:#2b3359}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0c0f1e;color:var(--text);line-height:1.45}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}

  /* Cadre téléphone sur grand écran, plein écran sur mobile */
  .stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  .phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 32px));background:var(--bg);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  @media (max-width:480px){
    .stage{padding:0}
    .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  }

  .topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
  .topbar h1{font-size:17px;font-weight:700;flex:1}
  .topbar .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);font-size:18px}
  .logo{font-weight:800;letter-spacing:.5px}
  .logo b{color:var(--yellow)}

  main{flex:1;overflow-y:auto;padding:16px 16px 24px;scroll-behavior:smooth}
  .tabbar{height:var(--tab-h);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
  .tabbar button span.ico{font-size:20px}
  .tabbar button[aria-current="page"]{color:var(--green);font-weight:700}

  h2{font-size:20px;margin:20px 0 10px}
  h2:first-child{margin-top:0}
  h3{font-size:16px}
  .muted{color:var(--muted);font-size:14px}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .stack>*+*{margin-top:10px}

  .hero{background:linear-gradient(160deg,var(--navy),#2b3a78);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden}
  .hero .tag{display:inline-block;background:var(--yellow);color:#241c00;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
  .hero h2{font-size:22px;margin:12px 0 6px;line-height:1.2}
  .hero p{opacity:.85;font-size:14px}
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .countdown div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 0;text-align:center}
  .countdown b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .countdown small{font-size:11px;opacity:.75}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;background:var(--green);color:#04210f;width:100%}
  .btn.secondary{background:transparent;border:1.5px solid var(--line);color:var(--text)}
  .btn.yellow{background:var(--yellow);color:#241c00}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stats .card{text-align:center;padding:12px 4px;margin:0}
  .stats b{display:block;font-size:20px}
  .stats small{color:var(--muted);font-size:11px}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--navy);color:#fff}
  .pill.green{background:var(--green);color:#04210f}
  .pill.yellow{background:var(--yellow);color:#241c00}
  .pill.gray{background:var(--line);color:var(--text)}

  .seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .timeline{list-style:none;position:relative;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .timeline li{position:relative;margin-bottom:10px}
  .timeline li::before{content:"";position:absolute;left:-18px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
  .time{font-size:12px;font-weight:700;color:var(--green)}

  .avatar{width:48px;height:48px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  input[type=search],input[type=text],input[type=email],input[type=tel],select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit}
  input:focus,select:focus{outline:2px solid var(--green);border-color:transparent}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}

  .ticket{border:2px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--card);width:100%;text-align:left;display:block}
  .ticket[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,179,109,.2)}
  .price{font-size:20px;font-weight:800}
  .price s{font-size:13px;color:var(--muted);font-weight:400;margin-right:6px}
  .bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--green)}

  details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
  summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
  summary::after{content:"+";color:var(--green);font-weight:800}
  details[open] summary::after{content:"–"}
  details p{margin-top:8px;color:var(--muted);font-size:14px}

  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
  .steps i.on{background:var(--green)}

  .menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-decoration:none;text-align:left}
  .menu .ico{font-size:22px;width:32px;text-align:center}

  .qr{width:180px;height:180px;margin:12px auto;border-radius:12px;background:
    conic-gradient(from 90deg at 50% 50%,#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/22px 22px;border:10px solid #fff;outline:1px solid var(--line)}
  .badge-vis{background:linear-gradient(160deg,var(--green),#1c7a4a);color:#04210f;border-radius:20px;padding:22px;text-align:center}
  .badge-vis .circle{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.35);margin:10px auto;display:grid;place-items:center;font-size:30px}

  .notice{background:#fff8e1;color:#5c4400;border:1px solid #f0d98a;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  @media (prefers-color-scheme:dark){.notice{background:#3a3112;color:#f6e3a0;border-color:#5b4c1a}}
  .sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="app">
    <header class="topbar" id="topbar"></header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
  </div>
</div>

<script>
/* =====================================================================

   Données : contenu public du site https://jciacm.com/ (relevé le 2026-11-02).

const EVENT_START = new Date("2027-04-27T07:00:00Z");

const TICKETS = [
  { id:"gratuit",  name:"Gratuit",  price:0,     old:0,     left:null, total:null, perks:["Visite des stands","Accès au Salon 100 % IA"] },
  { id:"etudiant", name:"Étudiant", price:3500,  old:5000,  left:97,   total:100,  perks:["Accès aux 2 jours","Salon 100 % IA","Young AI Leaders","AI Career Fair"], note:"Carte étudiante valide exigée à l'entrée." },

];

const AWARDS = ["IA & santé","IA, agriculture & sécurité alimentaire","IA, éducation & formation","IA, inclusion financière & fintech","IA & administration publique","IA & cybersécurité","IA, langues nationales, culture & industries créatives","Recherche scientifique en IA","Femme de l'année en IA","Jeune talent / Étudiant chercheur de l'année"];
const AWARD_TL = [["15 nov. 2026","Lancement de l'appel à candidatures"],["Déc. 2026 – janv. 2027","Webinaires d'accompagnement"],["28 fév. 2027","Clôture des candidatures (23:59)"],["1 – 10 mars","Vérification administrative"],["15 mars","Publication des 50 projets présélectionnés"],["20 mars – 15 avril","Vote du public en ligne (40 %)"],["16 – 20 avril","Délibération finale du jury (60 %)"],["28 avril 2027","Gala et remise des prix"]];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fcfa = n => n === 0 ? "Gratuit" : n.toLocaleString("fr-FR") + " FCFA";
const initials = n => n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

const TABS = [["home","🏠","Accueil"],["programme","📅","Programme"],["speakers","🎤","Intervenants"],["tickets","🎟️","Billets"],["more","☰","Plus"]];

/* ---------- Vues ---------- */
const views = {
  home(){
    return {title:null, html:`

    return {title:"Programme", html:`

  speakers(){
    return {title:"Intervenants", html:`
    <input type="search" id="q" placeholder="Rechercher un intervenant" aria-label="Rechercher un intervenant">

/* ---------- Logique ---------- */
function bindRegister(){
  const r = state.reg;
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { r.ticket = b.dataset.pick; render("register"); });
  const map = {f1:"first",f2:"last",f3:"email",f4:"wa",f5:"org",f6:"role"};
  Object.entries(map).forEach(([id,key]) => { const el=$("#"+id); if(el) el.oninput = () => r[key] = el.value; });
  if($("#c1")) $("#c1").onchange = e => r.listed = e.target.checked;
  if($("#c2")) $("#c2").onchange = e => { r.terms = e.target.checked; $("#next").disabled = !r.terms; };
  if($("#pay")) $("#pay").onchange = e => r.pay = e.target.value;
  if(r.step===4) $("#next").disabled = !r.terms;
}
function validStep2(){
  const r = state.reg;
  if(![r.first,r.last,r.email,r.wa,r.org,r.role].every(v=>v.trim())) return "Merci de remplir tous les champs obligatoires (*).";
  if(!/^\S+@\S+\.\S+$/.test(r.email)) return "Adresse e-mail invalide.";
  return "";
}

let current = "home", timer = null;
function render(name){
  current = name;
  if(timer){ clearInterval(timer); timer = null; }
  const v = views[name]();
  const top = $("#topbar");
  top.innerHTML = v.title === null
    ? `<span class="logo">JCIA <b>2027</b></span><h1></h1>`
    : `${v.back?`<button class="back" data-go="${v.back}" aria-label="Retour">←</button>`:""}<h1>${v.title}</h1><span class="logo" style="font-size:13px">JCIA <b>2027</b></span>`;
  $("#view").innerHTML = v.html;
  $("#view").scrollTop = 0;
  const activeTab = ["register","confirmed"].includes(name) ? "tickets" : (TABS.find(t=>t[0]===name) ? name : "more");
  $("#tabbar").innerHTML = TABS.map(t=>`<button data-go="${t[0]}" ${t[0]===activeTab?'aria-current="page"':""}><span class="ico">${t[1]}</span>${t[2]}</button>`).join("");
  if(v.after) v.after();
  history.replaceState(null,"","#"+name);
}

function startCountdown(){
  const el = $("#cd"); if(!el) return;
  const tick = () => {
    let s = Math.max(0, Math.floor((EVENT_START - Date.now())/1000));
    const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
    el.innerHTML = [[d,"Jours"],[h,"Heures"],[m,"Min"],[s,"Sec"]].map(x=>`<div><b>${String(x[0]).padStart(2,"0")}</b><small>${x[1]}</small></div>`).join("");
  };
  tick(); timer = setInterval(tick, 1000);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-day],[data-buy],[data-step],[data-stub]");
  if(!t) return;
  if(t.dataset.stub){ e.preventDefault(); toast("Maquette — " + t.dataset.stub); return; }
  if(t.dataset.go) return render(t.dataset.go);
  if(t.dataset.day){ state.day = +t.dataset.day; return render("programme"); }
  if(t.dataset.buy){ state.reg.ticket = t.dataset.buy; state.reg.step = 2; return render("register"); }
  if(t.dataset.step){
    const r = state.reg, d = +t.dataset.step;
    if(d<0){ if(r.step===1) return render("tickets"); r.step--; return render("register"); }
    if(r.step===2){ const err = validStep2(); if(err) return toast(err); }
    if(r.step===4) return render("confirmed");
    r.step++; render("register");
  }
});

function toast(msg){
  let n = $("#toast");
  if(!n){ n = document.createElement("div"); n.id="toast"; n.setAttribute("role","status");
    n.style.cssText="position:absolute;left:16px;right:16px;bottom:80px;background:#111;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.4)";
    $("#app").appendChild(n); }
  n.textContent = msg; n.style.display = "block";
  clearTimeout(n._t); n._t = setTimeout(()=>n.style.display="none", 2600);
}

const start = location.hash.slice(1);
render(views[start] ? start : "home");
