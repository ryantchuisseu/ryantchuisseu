<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>JCIA 2027 — Maquette app</title>
<style>
  /* Charte graphique JCIA 2027 v1.0 — nuit & chaleur, police Sora */
  :root{
    --night:#0E1326; --header:#0F1427; --card:#182039; --section:#1A223C; --line:#2C3147;
    --orange:#F6A343; --orange-2:#E3843D; --turquoise:#2DB8BD; --terracotta:#CD6035;
    --violet:#5D4696; --violet-l:#9D87DC; --ink:#19203A; --muted:#B5BAD0; --text:#ffffff;
    --radius:22px; --tab-h:66px;
    /* variables thématiques (surchargées en version Jour) */
    --acc:#F6A343; --g1:#F6A343; --g2:#E3843D; --stage:#080b17;
    --k1:#F6A343; --k2:#2DB8BD; --k3:#CD6035; --k4:#9D87DC;
  }
  /* Version Jour — palette « Jour » de la charte : crème #FBF6EE, sable #F4E6D2, encre #19203A.
     Valeurs dérivées (non définies par la charte) : --acc, --g1/--g2, --k1/--k2, --muted, --line, --stage,
     assombries pour tenir le contraste 4,5:1 sur fond clair. L'en-tête et la barre d'onglets restent sombres
     (le logo a un lettrage blanc : interdit sur fond clair). */
  :root[data-theme="day"]{
    --night:#FBF6EE; --card:#F4E6D2; --section:#FFFFFF; --line:#E0CFB3; --text:#19203A; --muted:#565C75;
    --acc:#9A4C07; --g1:#B8600D; --g2:#9A4C07; --stage:#E7DCC9;
    --k1:#B8600D; --k2:#1B7F84; --k3:#CD6035; --k4:#5D4696;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{color-scheme:dark}
  body{font-family:"Sora",Arial,sans-serif;background:var(--stage);color:var(--text);line-height:1.6;font-size:15px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:var(--acc)}
  :focus-visible{outline:3px solid var(--acc);outline-offset:2px}

  .stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  .phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 32px));background:var(--night);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  @media (max-width:480px){
    .stage{padding:0}
    .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  }

  .topbar{background:var(--header);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
  .topbar h1{font-size:17px;font-weight:700;flex:1}
  .topbar .back,.topbar .theme-btn{width:44px;height:44px;border-radius:50%;background:#182039;border:1px solid #2C3147;color:#fff;font-size:18px;flex:none}
  .topbar .logo-img{width:150px;height:auto;display:block}
  .topbar .mini{font-size:12px;font-weight:800;letter-spacing:.04em;color:#B5BAD0}
  .topbar .spacer{flex:1}
  .topbar .mini b{color:var(--orange)}
  .band{height:22px;background:var(--header) url(assets/bande-toghu.png) repeat-x 0 50%/auto 22px;flex:none}

  main{flex:1;overflow-y:auto;padding:18px 16px 28px;scroll-behavior:smooth}
  .tabbar{height:var(--tab-h);background:var(--header);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#B5BAD0;min-height:44px}
  .tabbar button span.ico{font-size:20px}
  .tabbar button[aria-current="page"]{color:var(--orange);font-weight:700}
  .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--orange)}

  h2{font-size:22px;font-weight:700;margin:24px 0 10px;line-height:1.25}
  h2:first-child{margin-top:0}
  h3{font-size:16px;font-weight:700;line-height:1.35}
  .muted{color:var(--muted);font-size:13.5px}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--acc);font-weight:700}
  .grad{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .row{display:flex;gap:12px;align-items:center}
  .grow{flex:1;min-width:0}
  .stack>*+*{margin-top:10px}

  /* Cartes à filet coloré + numéro en filigrane (opacité 14 %) */
  .chal{position:relative;overflow:hidden;border-top:5px solid var(--c);padding-top:14px}
  .chal .eyebrow{color:var(--muted);font-size:11px}
  .chal::after{content:attr(data-n);position:absolute;right:12px;top:6px;font-size:54px;font-weight:800;color:var(--c);opacity:.14;line-height:1;pointer-events:none}
  .c1{--c:var(--orange)} .c2{--c:var(--turquoise)} .c3{--c:var(--terracotta)} .c4{--c:var(--violet)}

  .hero{background:radial-gradient(120% 80% at 100% 0%,#232c52 0%,var(--night) 60%);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--acc);border:1.5px solid var(--acc);padding:3px 12px;border-radius:99px}
  .hero h2{font-size:26px;font-weight:800;margin:14px 0 8px;line-height:1.15}
  .hero .theme{color:var(--muted);font-size:14px}
  .hero-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
  .hero-meta .map{width:84px;height:auto;border-radius:14px;flex:none}
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .countdown div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;text-align:center}
  .countdown b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
  .countdown small{font-size:11px;color:var(--muted)}

  /* Boutons : pilule, dégradé orange, 44 px mini, un seul bouton plein par écran */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 20px;border-radius:99px;font-weight:700;background:linear-gradient(90deg,var(--orange),var(--orange-2));color:var(--ink);width:100%;text-decoration:none;box-shadow:0 6px 18px rgba(246,163,67,.28)}
  .btn.secondary{background:transparent;border:1.5px solid var(--acc);color:var(--acc);box-shadow:none}
  .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stats .card{text-align:center;padding:14px 6px;margin:0;border-top:5px solid var(--c,var(--orange))}
  .stats .card:nth-child(1){--c:var(--k1)} .stats .card:nth-child(2){--c:var(--k2)}
  .stats .card:nth-child(3){--c:var(--k3)} .stats .card:nth-child(4){--c:var(--k4)}
  .stats b{display:block;font-size:28px;font-weight:800;color:var(--c);line-height:1.2}
  .stats small{color:var(--muted);font-size:12px}
  .stats.three{grid-template-columns:repeat(3,1fr)} .stats.three b{font-size:22px}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--section);border:1px solid var(--line);color:var(--muted)}
  .pill.orange{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .pill.violet{background:var(--violet);border-color:var(--violet);color:#fff}

  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;min-height:44px;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--orange);color:var(--ink);font-weight:700}

  .timeline{list-style:none;position:relative;padding-left:20px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .timeline li{position:relative}
  .timeline li::before{content:"";position:absolute;left:-20px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid var(--night)}
  .time{font-size:12px;font-weight:700;color:var(--acc)}

  .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,var(--violet),var(--section));border:1px solid var(--violet-l);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  input[type=search],input[type=text],input[type=email],input[type=tel],select{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit}
  input::placeholder{color:var(--muted)}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none;margin-top:3px}

  .ticket{border:2px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--card);width:100%;text-align:left;display:block}
  .ticket[aria-pressed="true"]{border-color:var(--acc);background:var(--section)}
  .ticket .sel{display:none;font-size:12px;font-weight:700;color:var(--acc)}
  .ticket[aria-pressed="true"] .sel{display:inline}
  .price{font-size:22px;font-weight:800;color:var(--acc)}
  .price s{font-size:13px;color:var(--muted);font-weight:400;margin-right:6px}
  .bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2))}
  .bar i.t{background:var(--turquoise)}

  details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:8px}
  summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:24px}
  summary::after{content:"+";color:var(--acc);font-weight:800}
  details[open] summary::after{content:"–"}
  details p{margin-top:8px;color:var(--muted);font-size:14px}

  .steps{display:flex;gap:6px;margin-bottom:6px}
  .steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
  .steps i.on{background:var(--acc)}
  .steps-l{font-size:12px;color:var(--muted);margin-bottom:14px}

  .menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;text-decoration:none;text-align:left;color:var(--text)}
  .menu .ico{font-size:22px;width:32px;text-align:center}

  .qr{width:180px;height:180px;margin:12px auto;border-radius:12px;background:conic-gradient(from 90deg at 50% 50%,#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/22px 22px;border:10px solid #fff}
  .badge-vis{background:linear-gradient(160deg,var(--orange),var(--orange-2));color:var(--ink);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:12px}
  .badge-vis .circle{width:84px;height:84px;border-radius:50%;background:rgba(25,32,58,.18);margin:10px auto;display:grid;place-items:center;font-size:30px}

  .notice{background:var(--section);color:var(--text);border:1px solid var(--acc);border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  ol,ul{color:var(--muted)}
  .timeline,.timeline li{color:var(--text)}
  :root[data-theme="day"] .hero{background:linear-gradient(160deg,#FFFFFF 0%,var(--card) 100%)}
  :root[data-theme="day"] .countdown div,:root[data-theme="day"] input,:root[data-theme="day"] select{background:#fff}
  :root[data-theme="day"] .phone{box-shadow:0 20px 60px rgba(25,32,58,.25)}
</style>
</head>

/* ---------- Logique ---------- */
function bindRegister(){
  const r = state.reg;
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { r.ticket = b.dataset.pick; render("register"); });
  const map = {f1:"first",f2:"last",f3:"email",f4:"wa",f5:"org",f6:"role"};
  Object.entries(map).forEach(([id,key]) => { const el=$("#"+id); if(el) el.oninput = () => r[key] = el.value; });
  if($("#c1")) $("#c1").onchange = e => r.listed = e.target.checked;
  if($("#c2")) $("#c2").onchange = e => { r.terms = e.target.checked; $("#next").disabled = !r.terms; };
  if($("#pay")) $("#pay").onchange = e => r.pay = e.target.value;
  if(r.step===4) $("#next").disabled = !r.terms;
}
function validStep2(){
  const r = state.reg;
  if(![r.first,r.last,r.email,r.wa,r.org,r.role].every(v=>v.trim())) return "Merci de remplir tous les champs obligatoires (*).";
  if(!/^\S+@\S+\.\S+$/.test(r.email)) return "Adresse e-mail invalide.";
  return "";
}

/* ---------- Thème Nuit / Jour ---------- */
const THEME_KEY = "jcia-theme";
function getTheme(){ return document.documentElement.dataset.theme === "day" ? "day" : "night"; }
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
}
function themeBtn(){
  const day = getTheme()==="day";
  return `<button class="theme-btn" data-theme-toggle aria-label="${day?"Passer à la version Nuit":"Passer à la version Jour"}">${day?"🌙":"☀️"}</button>`;
}
(function initTheme(){
  let t = "night";
  try { t = localStorage.getItem(THEME_KEY) || t; } catch(e) {}
  const q = new URLSearchParams(location.search).get("theme");   // ?theme=day pour partager un lien direct
  if(q==="day"||q==="night") t = q;
  document.documentElement.dataset.theme = t==="day" ? "day" : "night";
})();

let current = "home", timer = null;
function render(name){
  current = name;
  if(timer){ clearInterval(timer); timer = null; }
  const v = views[name]();
  const top = $("#topbar");
  top.innerHTML = v.title === null
    ? `<img class="logo-img" src="assets/logo-jcia.png" alt="JCIA — Journées Camerounaises de l'Intelligence Artificielle, Hilton Yaoundé, 27 et 28 avril 2027" width="150" height="65"><span class="spacer"></span>${themeBtn()}`
    : `${v.back?`<button class="back" data-go="${v.back}" aria-label="Retour">←</button>`:""}<h1>${v.title}</h1><span class="mini">JCIA <b>2027</b></span>${themeBtn()}`;
  $("#view").innerHTML = v.html;
  $("#view").scrollTop = 0;
  const activeTab = ["register","confirmed"].includes(name) ? "tickets" : (TABS.find(t=>t[0]===name) ? name : "more");
  $("#tabbar").innerHTML = TABS.map(t=>`<button data-go="${t[0]}" ${t[0]===activeTab?'aria-current="page"':""}><span class="ico">${t[1]}</span>${t[2]}</button>`).join("");
  if(v.after) v.after();
  history.replaceState(null,"","#"+name);
}

function startCountdown(){
  const el = $("#cd"); if(!el) return;
  const tick = () => {
    let s = Math.max(0, Math.floor((EVENT_START - Date.now())/1000));
    const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
    el.innerHTML = [[d,"Jours"],[h,"Heures"],[m,"Min"],[s,"Sec"]].map(x=>`<div><b>${String(x[0]).padStart(2,"0")}</b><small>${x[1]}</small></div>`).join("");
  };
  tick(); timer = setInterval(tick, 1000);
}

document.addEventListener("click", e => {
  const th = e.target.closest("[data-theme-toggle],[data-theme-set]");
  if(th){ setTheme(th.dataset.themeSet || (getTheme()==="day" ? "night" : "day")); return render(current); }
  const t = e.target.closest("[data-go],[data-day],[data-buy],[data-step],[data-stub]");
  if(!t) return;
  if(t.dataset.stub){ e.preventDefault(); toast("Maquette — " + t.dataset.stub); return; }
  if(t.dataset.go) return render(t.dataset.go);
  if(t.dataset.day){ state.day = +t.dataset.day; return render("programme"); }
  if(t.dataset.buy){ state.reg.ticket = t.dataset.buy; state.reg.step = 2; return render("register"); }
  if(t.dataset.step){
    const r = state.reg, d = +t.dataset.step;
    if(d<0){ if(r.step===1) return render("tickets"); r.step--; return render("register"); }
    if(r.step===2){ const err = validStep2(); if(err) return toast(err); }
    if(r.step===4) return render("confirmed");
    r.step++; render("register");
  }
});

function toast(msg){
  let n = $("#toast");
  if(!n){ n = document.createElement("div"); n.id="toast"; n.setAttribute("role","status");
    n.style.cssText="position:absolute;left:16px;right:16px;bottom:80px;background:#111;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.4)";
    $("#app").appendChild(n); }
  n.textContent = msg; n.style.display = "block";
  clearTimeout(n._t); n._t = setTimeout(()=>n.style.display="none", 2600);
}

const start = location.hash.slice(1);
render(views[start] ? start : "home");
</script>
